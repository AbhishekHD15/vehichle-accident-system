# Render blueprint: managed PostgreSQL + FastAPI web service (+ static frontend)
databases:
  - name: accident-db
    databaseName: accident_db
    plan: basic-256mb      # paid plans include automated backups; verify current plan names
services:
  - type: web
    name: accident-api
    runtime: docker
    rootDir: accident-cloud
    healthCheckPath: /health/ready
    envVars:
      - {key: APP_ENV, value: production}
      - {key: ENABLE_DOCS, value: "false"}
      - {key: DATABASE_URL, fromDatabase: {name: accident-db, property: connectionString}}
      - {key: JWT_SECRET, generateValue: true}
      - {key: CORS_ORIGINS, value: https://YOUR-FRONTEND.onrender.com}
  - type: web
    name: accident-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - {type: rewrite, source: /*, destination: /index.html}
    envVars:
      - {key: VITE_API_BASE_URL, value: https://YOUR-API.onrender.com/api/v1}
      - {key: VITE_WS_URL, value: wss://YOUR-API.onrender.com/api/v1/ws}
